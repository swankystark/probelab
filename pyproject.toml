[project]
name = "probelab"
version = "0.1.0"
description = "Visually grounded autonomous physical system discovery"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=2.0",
  "scipy>=1.14",
  "opencv-python-headless>=4.10",
  "openai>=1.55",
  "meta-sam-parser>=0.0.6",
  "pydantic-settings>=2.6"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
